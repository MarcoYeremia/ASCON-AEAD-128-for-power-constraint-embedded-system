# ======================================================
# Project metadata (used for documentation / review)
# ======================================================
project:
  title: "ASCON-AEAD128 for Power-Constrained Embedded System"
  team: "A68"
  discord: "Maco, Kennnnn, Arch, Corryn, lelektro"
  description: "Hardware implementation of Ascon cryptography with SPI interface"
  lvs_config: "lvs_config.json"


pins:
  - name: VSS
    io_type: ground 
  - name: clk
    io_type: input_schmitt
  - name: rst       
    io_type: input_cmos
  - name: cs_n # SPI chip select
    io_type: input_cmos
  - name: sclk # SPI Clock
    io_type: input_schmitt
  - name: mosi # SPI Master Out Slave In
    io_type: input_cmos
  - name: miso # SPI Master In Slave Out
    io_type: bidirectional
  - name: VDD
    io_type: power

        
