# ======================================================
# Project metadata (used for documentation / review)
# ======================================================
project:
  title: "ASCON-AEAD128 for Power-Constrained Embedded System"
  team: "A68"
  discord: "Maco, Kennnnn, Arch, Corryn, lelektro"
  description: "Hardware implementation of Ascon cryptography with SPI interface"
  lvs_config: "lvs_config.json"

# ======================================================
# Pad Map / Pin Connectivity
# ======================================================
pinout:
  - name: "clk"
    direction: "input"
    description: "System clock"
  - name: "rst"       
    direction: "input"
    description: "Active-low reset"
  - name: "cs_n"
    direction: "input"
    description: "SPI Chip Select"
  - name: "sclk"
    direction: "input"
    description: "SPI Clock"
  - name: "mosi"
    direction: "input"
    description: "SPI Master Out Slave In"
  - name: "miso"
    direction: "output"
    description: "SPI Master In Slave Out"

# =======================================================================
